openapi: 3.0.1
info:
  title: Travel
  version: 0.1.0
servers:
- url: "{server}:{port}/travel"
  variables:
    server:
      default: http://localhost
    port:
      default: "9090"
paths:
  /chat:
    post:
      summary: Chat with the trip planner. The conversation is scoped to the calling
        employee.
      operationId: postChat
      parameters:
      - name: x-employee-id
        in: header
        description: The calling employee
        required: true
        schema:
          type: string
      requestBody:
        description: Session ID and message
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: InternalServerError
        "403":
          description: Forbidden
        "409":
          description: Conflict
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /approvals:
    get:
      summary: Lists the bookings waiting for the calling manager's decision.
      operationId: getApprovals
      parameters:
      - name: x-employee-id
        in: header
        description: The calling manager
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalView"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /approvals/{approvalId}:
    post:
      summary: "Approves or rejects a pending booking, then resumes the paused conversation."
      operationId: postApprovalsApprovalid
      parameters:
      - name: approvalId
        in: path
        description: The approval to decide
        required: true
        schema:
          type: string
      - name: x-employee-id
        in: header
        description: The calling manager
        required: true
        schema:
          type: string
      requestBody:
        description: "APPROVE or REJECT, with an optional reason"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: InternalServerError
        "403":
          description: Forbidden
        "404":
          description: NotFound
        "409":
          description: Conflict
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /proposals/{proposalId}:
    get:
      summary: "Returns a trip proposal with its policy result, booking status and\
        \ audit trail."
      operationId: getProposalsProposalid
      parameters:
      - name: proposalId
        in: path
        description: The proposal to read
        required: true
        schema:
          type: string
      - name: x-employee-id
        in: header
        description: The traveler or their manager
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripProposal"
        "403":
          description: Forbidden
        "404":
          description: NotFound
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
components:
  schemas:
    ApprovalDecision:
      required:
      - outcome
      type: object
      properties:
        outcome:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
      additionalProperties: false
    ApprovalView:
      required:
      - approvalId
      - proposal
      - requestedAt
      type: object
      properties:
        approvalId:
          type: string
        requestedAt:
          type: string
        proposal:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/TripProposal"
      additionalProperties: false
    AuditEvent:
      required:
      - action
      - actor
      - at
      - detail
      type: object
      properties:
        at:
          type: string
        actor:
          type: string
        action:
          type: string
        detail:
          type: string
      additionalProperties: false
    BookingResult:
      type: object
      properties:
        flightOrderId:
          type: string
          nullable: true
        flightBookingReference:
          type: string
          nullable: true
        hotelBookingId:
          type: string
          nullable: true
        hotelBookingReference:
          type: string
          nullable: true
        issues:
          type: array
          items:
            type: string
          default: []
      additionalProperties: false
    CabinClass:
      type: string
      enum:
      - economy
      - premium_economy
      - business
      - first
    ChatRequest:
      required:
      - message
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
        message:
          type: string
      additionalProperties: false
    ChatResponse:
      required:
      - message
      - pendingApprovals
      - sessionId
      - status
      type: object
      properties:
        sessionId:
          type: string
        status:
          $ref: "#/components/schemas/ChatStatus"
        message:
          type: string
        pendingApprovals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalView"
      additionalProperties: false
    ChatStatus:
      type: string
      enum:
      - COMPLETED
      - AWAITING_APPROVAL
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    FlightOffer:
      required:
      - airline
      - cabinClass
      - changeable
      - currency
      - departureDate
      - expiresAt
      - legs
      - longestLegHours
      - offerId
      - passengerId
      - refundable
      - totalAmount
      type: object
      properties:
        offerId:
          type: string
        passengerId:
          type: string
        airline:
          type: string
        cabinClass:
          $ref: "#/components/schemas/CabinClass"
        totalAmount:
          type: number
          format: double
        currency:
          type: string
        longestLegHours:
          type: number
          description: "The longest single flight in the offer, in hours, excluding\
            \ connection time"
          format: double
        departureDate:
          type: string
        legs:
          type: array
          items:
            type: string
        refundable:
          type: boolean
        changeable:
          type: boolean
        expiresAt:
          type: string
      additionalProperties: false
      description: |-
        A flight offer the agent has seen. Only offers returned by a search can be looked up later,
        so an LLM cannot invent an offer ID.
    HotelRate:
      required:
      - boardType
      - checkInDate
      - checkOutDate
      - currency
      - hotelName
      - isTestInventory
      - nights
      - rateId
      - refundable
      - roomName
      - totalAmount
      type: object
      properties:
        rateId:
          type: string
        hotelName:
          type: string
        roomName:
          type: string
        boardType:
          type: string
        totalAmount:
          type: number
          format: double
        currency:
          type: string
        checkInDate:
          type: string
        checkOutDate:
          type: string
        nights:
          type: integer
          format: int64
        refundable:
          type: boolean
        isTestInventory:
          type: boolean
          description: "True in Duffel test mode: the rate is for a test property\
            \ standing in for one at the destination"
      additionalProperties: false
      description: A bookable hotel rate the agent has seen. Only rates returned by
        getHotelRates can be looked up later.
    PolicyEvaluation:
      required:
      - compliant
      - highestAllowedCabin
      - totalUsd
      - violations
      - warnings
      type: object
      properties:
        compliant:
          type: boolean
        totalUsd:
          type: number
          format: double
        highestAllowedCabin:
          $ref: "#/components/schemas/CabinClass"
        violations:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    ProposalStatus:
      type: string
      description: |-
        NEEDS_REVIEW: an order or booking call failed in a way that may still have booked, so check Duffel
        before trying again.
      enum:
      - PROPOSED
      - BOOKING
      - BOOKED
      - PARTIALLY_BOOKED
      - FAILED
      - NEEDS_REVIEW
      - REJECTED
    TripProposal:
      required:
      - approverId
      - auditTrail
      - booking
      - createdAt
      - destination
      - destinationCountry
      - employeeId
      - flight
      - hotel
      - policy
      - proposalId
      - purpose
      - status
      type: object
      properties:
        proposalId:
          type: string
        employeeId:
          type: string
        approverId:
          type: string
        purpose:
          type: string
        destination:
          type: string
        destinationCountry:
          type: string
        flight:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FlightOffer"
        hotel:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/HotelRate"
        policy:
          $ref: "#/components/schemas/PolicyEvaluation"
        status:
          $ref: "#/components/schemas/ProposalStatus"
        createdAt:
          type: string
        booking:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/BookingResult"
        auditTrail:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
      additionalProperties: false
