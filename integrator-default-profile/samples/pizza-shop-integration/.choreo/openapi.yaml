openapi: 3.0.1
info:
  title: OrderManagementAgent
  version: 0.1.0
servers:
- url: "{server}:{port}/orderManagementAgent"
  variables:
    server:
      default: http://localhost
    port:
      default: "9090"
paths:
  /chat:
    post:
      operationId: postChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatReqMessage'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRespMessage'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  schemas:
    ChatReqMessage:
      required:
      - message
      - sessionId
      type: object
      properties:
        sessionId:
          type: string
        message:
          type: string
      additionalProperties: false
      description: Represents a request message for the chat service.
    ChatRespMessage:
      required:
      - message
      type: object
      properties:
        message:
          type: string
      additionalProperties: false
      description: Represents a response message from the chat service.
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
