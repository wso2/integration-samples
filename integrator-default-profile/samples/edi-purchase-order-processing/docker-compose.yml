# Local SFTP server standing in for the trading partner's mailbox.
# Creates user partner/partner123 with the inbox, processed, rejected, and outbox folders.
# Start with: docker compose up -d
services:
  sftp:
    image: atmoz/sftp:alpine
    container_name: edi-sftp
    ports:
      - "2222:22"
    command: partner:partner123:::edi/inbox,edi/processed,edi/rejected,edi/outbox
